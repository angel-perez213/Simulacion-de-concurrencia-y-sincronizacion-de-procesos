<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nave espacial con robots</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            background: #02060d;
            color: #f2f6ff;
            font-family: Consolas, Monaco, monospace;
            -webkit-font-smoothing: antialiased;
            text-rendering: geometricPrecision;
        }

        .app {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #02060d;
        }

        #canvas {
            position: absolute;
            left: 0;
            top: 0;
            background: #02060d;
            display: block;
            image-rendering: auto;
        }

        .open-terminal-btn {
            position: absolute;
            left: 24px;
            top: 140px;
            z-index: 20;
            background: #001a10;
            color: #00ff8a;
            border: 2px solid #00ff8a;
            padding: 9px 14px;
            font-family: Consolas, Monaco, monospace;
            font-weight: bold;
            cursor: pointer;
            min-width: 125px;
        }

        .open-terminal-btn:hover { background: #00331f; }

        .bottom-bar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 44px;
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 6px 26px;
            background: #e8edf5;
            color: #121820;
            z-index: 15;
            font-family: Arial, sans-serif;
            font-size: 13px;
            white-space: nowrap;
        }

        .bottom-bar .hint { margin-right: 14px; }

        .bottom-bar button {
            background: #222;
            color: #fff;
            border: 1px solid #777;
            padding: 6px 14px;
            min-width: 80px;
            height: 28px;
            cursor: pointer;
            font-size: 12px;
        }

        .bottom-bar button:hover { background: #444; }

        .terminal-modal {
            position: absolute;
            left: 35px;
            top: 92px;
            width: min(590px, calc(100vw - 70px));
            height: min(390px, calc(100vh - 135px));
            min-height: 260px;
            z-index: 50;
            display: none;
            flex-direction: column;
            background: #00140a;
            border: 1px solid #0f3d25;
            box-shadow: 0 10px 28px rgba(0,0,0,0.55);
            resize: both;
            overflow: hidden;
        }

        .terminal-modal.visible { display: flex; }

        .terminal-header {
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            background: #00140a;
            color: #00ff8a;
            font-weight: bold;
            user-select: none;
        }

        .terminal-header button {
            background: #002414;
            color: #00ff8a;
            border: 0;
            width: 32px;
            height: 26px;
            cursor: pointer;
            font-weight: bold;
        }

        #terminal-output {
            flex: 1;
            margin: 0 10px 10px 10px;
            padding: 10px;
            background: #000805;
            color: #00ff8a;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 12px;
            line-height: 1.35;
            border: 1px solid #002414;
        }

        .terminal-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px 12px 10px;
            background: #00140a;
        }

        .terminal-input-row label {
            color: #00ff8a;
            font-weight: bold;
        }

        #terminal-input {
            flex: 1;
            min-width: 0;
            background: #00140a;
            color: #00ff8a;
            border: 0;
            outline: none;
            padding: 8px;
            font-family: Consolas, Monaco, monospace;
            border-bottom: 1px solid #00ff8a;
        }

        #terminal-run {
            background: #00ff8a;
            color: #000;
            border: 0;
            padding: 8px 15px;
            cursor: pointer;
            font-weight: bold;
        }

        @media (max-width: 760px) {
            .bottom-bar {
                overflow-x: auto;
                padding: 6px 10px;
            }
            .bottom-bar button { min-width: 72px; }
            .open-terminal-btn { left: 12px; top: 120px; }
            .terminal-modal { left: 10px; top: 72px; width: calc(100vw - 20px); }
        }
    </style>
</head>
<body>
    <div class="app">
        <canvas id="canvas" width="1320" height="690"></canvas>

        <button class="open-terminal-btn" id="open-terminal">Abrir Terminal</button>

        <div class="terminal-modal" id="terminal-modal" aria-label="Terminal NaveOS">
            <div class="terminal-header">
                <span>NAVE ESPACIAL v2.0</span>
                <button id="terminal-close" title="Cerrar">x</button>
            </div>
            <div id="terminal-output"></div>
            <div class="terminal-input-row">
                <label for="terminal-input">MiShell&gt;</label>
                <input id="terminal-input" autocomplete="off" spellcheck="false" />
                <button id="terminal-run">Ejecutar</button>
            </div>
        </div>

        <div class="bottom-bar">
            <span class="hint">1-4. Algoritmos | N: Robot | R: Resolver</span>
            <button data-command="alg fifo">1 FIFO</button>
            <button data-command="alg sjf">2 SJF</button>
            <button data-command="alg rr">3 RR</button>
            <button data-command="alg prio">4 Prioridad</button>
            <button data-command="create">+ Robot</button>
            <button data-command="mutex">Mutex</button>
            <button data-command="deadlock">Deadlock</button>
            <button data-command="resolve">Resolver</button>
            <button data-command="mpdiag">MP Diag</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
